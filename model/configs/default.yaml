# Cấu hình mặc định cho huấn luyện mô hình nhận diện bệnh lá cà chua.
# Chạy:  python -m src.training.train --config configs/default.yaml

seed: 42

data:
  # Thư mục chứa dữ liệu PlantVillage gốc (các thư mục con Tomato___*)
  raw_dir: data/raw
  # Nơi ghi manifest chia tập (không copy ảnh, chỉ ghi đường dẫn)
  processed_dir: data/processed
  # Thư mục ảnh tự chụp ngoài đồng — dùng để đánh giá domain gap
  field_dir: data/field
  image_size: 224
  val_ratio: 0.15
  test_ratio: 0.15
  batch_size: 32
  # 8 worker cho máy 16 luồng. Đo 20/08/2026 với 4 worker: epoch thật ~42s
  # trong khi GPU chỉ cần ~30s — GPU ngồi chờ CPU giải mã ảnh ~12s mỗi epoch.
  num_workers: 8

model:
  # efficientnet_b0 | efficientnet_b3 | resnet50 | resnet18
  arch: efficientnet_b0
  pretrained: true
  dropout: 0.3

train:
  epochs: 25
  lr: 0.0003
  weight_decay: 0.0001
  # Số epoch đầu đóng băng backbone, chỉ huấn luyện lớp phân loại.
  # Giúp lớp mới không phá hỏng trọng số pretrained ngay từ đầu.
  freeze_backbone_epochs: 3
  label_smoothing: 0.05
  early_stopping_patience: 6
  # Dùng mixed precision nếu có GPU — nhanh hơn đáng kể
  amp: true

# Tăng cường dữ liệu. Cấu hình mạnh tay một chút vì ảnh PlantVillage
# chụp trong phòng, còn ảnh thật ngoài đồng thì đủ kiểu ánh sáng và góc chụp.
augment:
  horizontal_flip: 0.5
  vertical_flip: 0.2
  rotation_degrees: 30
  color_jitter:
    brightness: 0.3
    contrast: 0.3
    saturation: 0.3
    hue: 0.05
  random_resized_crop_scale: [0.7, 1.0]
  gaussian_blur_prob: 0.15
  # Chỉ dùng lúc huấn luyện; nền chỉ lấy từ split train của bộ ảnh âm.
  # Thí nghiệm #50 bật trong cấu hình lưu cùng checkpoint; không sửa số liệu cũ.
  outdoor:
    enabled: false
    background_manifest: data/processed/gate-split.csv
    background_prob: 0.7
    light_prob: 0.5

xai:
  # gradcam | gradcam_plusplus — chọn bản ++ mặc định ngày 02/11/2026.
  # Nhánh offline trên điện thoại vẫn dùng CAM cổ điển (không có backprop).
  method: gradcam_plusplus
  # Ngưỡng cắt heatmap để tạo vùng khoanh (0..1)
  heatmap_threshold: 0.5
  # Chốt hiển thị theo vùng lá ước lượng; không phải xác suất giải thích đúng.
  reliability:
    enabled: true
    min_leaf_mass: 0.65
    min_lift: 0.05

preprocess:
  leaf_crop:
    # #93: validation CPU không tăng khi cắt; giữ tuỳ chọn để đối chứng.
    enabled: false
    padding: 0.08
    min_area: 0.05
    max_area: 0.90
    min_dominance: 0.65

paths:
  checkpoint_dir: checkpoints
  output_dir: outputs
