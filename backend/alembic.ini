; Cấu hình Alembic — quản lý thay đổi cấu trúc CSDL.
;
; Giai đoạn đầu có thể dùng `python -m app.db.init_db` cho nhanh. Khi đã có dữ
; liệu thật cần giữ lại qua các lần đổi bảng thì chuyển sang Alembic:
;
;   alembic revision --autogenerate -m "them cot xyz"
;   alembic upgrade head
;   alembic downgrade -1
;
; Chuỗi kết nối KHÔNG đặt ở đây mà đọc từ .env (xem migrations/env.py) để không
; lỡ tay đưa mật khẩu CSDL lên Git.

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
