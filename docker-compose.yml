services:
  db:
    image: postgres:16-alpine
    container_name: plantdx-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: plantdx
      POSTGRES_PASSWORD: plantdx
      POSTGRES_DB: plantdx
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "5432:5432"
    volumes:
      - plantdx-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plantdx -d plantdx"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Giao diện web xem/sửa CSDL trực tiếp — tiện lúc phát triển, không bắt buộc.
  # Truy cập http://localhost:8080 (System: PostgreSQL, Server: db, User/Pass: plantdx)
  adminer:
    image: adminer:latest
    container_name: plantdx-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: plantdx-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      # Backend nạp code model/ bằng sys.path ngay trong tiến trình của nó
      # (xem app/services/inference/loader.py) — không mount thì không có
      # "src" để import, checkpoint dù đặt đúng cũng rơi về DummyPredictor.
      - ./model:/model:ro
      # settings.disease_catalog_path suy từ PROJECT_ROOT = cha của thư mục
      # backend — trong container đó là "/", nên phải mount đúng chỗ thành
      # "/shared". Thiếu dòng này thì GET /diseases lúc nào cũng 500 trong
      # Docker (lỗi có từ trước, không liên quan tới việc bật mô hình thật).
      - ./shared:/shared:ro
    environment:
      - DATABASE_URL=postgresql://plantdx:plantdx@db:5432/plantdx
      - MODEL_CHECKPOINT=/model/checkpoints/leaf_disease_detection_model.pt
      - MODEL_PACKAGE_DIR=/model
      - MODEL_DEVICE=cpu
    depends_on:
      db:
        condition: service_healthy

  # Next.js (App Router) — xem web-admin/README.md. Đổi từ Vite/5173 sang
  # Next.js/3000 ngày 16/09/2026; kiến trúc BFF nên chỉ cần một biến môi
  # trường BACKEND_URL trỏ tới service "backend" trong cùng mạng compose,
  # không cần thêm origin này vào CORS_ORIGINS của backend (mọi lệnh gọi
  # chạy phía server của Next.js, không phải trình duyệt — xem CLAUDE.md).
  web-admin:
    image: node:20-alpine
    container_name: plantdx-web-admin
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./web-admin:/app
      # node_modules/.next cài riêng cho Linux trong container — không để bind
      # mount từ host (thường là Windows) đè lên, ngược lại cũng không để
      # container ghi ngược ra thư mục host.
      - web-admin-node-modules:/app/node_modules
      - web-admin-next-cache:/app/.next
    ports:
      - "3000:3000"
    environment:
      - BACKEND_URL=http://backend:8000
      # Bắt buộc trên Windows: bind mount ./web-admin vào container đi qua 9p
      # (WSL2 <-> Docker Desktop), filesystem này KHÔNG báo sự kiện inotify khi
      # sửa file từ phía Windows — webpack watch của Next.js đứng im, sửa code
      # không tự hot-reload dù nội dung file trong container đã đổi (đã kiểm
      # chứng thật: sửa xong, đợi, gọi lại trang vẫn ra bản cũ). WATCHPACK_POLLING
      # bắt Next.js tự polling thay vì chờ inotify — cái giá là dùng nhiều CPU hơn
      # một chút lúc idle, chấp nhận được để đổi lấy hot-reload chạy đúng.
      - WATCHPACK_POLLING=true
    command: sh -c "npm install && npm run dev -- -H 0.0.0.0"
    depends_on:
      - backend

volumes:
  plantdx-pgdata:
  web-admin-node-modules:
  web-admin-next-cache:
