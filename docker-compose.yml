services:
  db:
    image: postgres:16-alpine
    container_name: plantdx-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: plantdx
      POSTGRES_PASSWORD: plantdx
      POSTGRES_DB: plantdx
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "5432:5432"
    volumes:
      - plantdx-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plantdx -d plantdx"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Giao diện web xem/sửa CSDL trực tiếp — tiện lúc phát triển, không bắt buộc.
  # Truy cập http://localhost:8080 (System: PostgreSQL, Server: db, User/Pass: plantdx)
  adminer:
    image: adminer:latest
    container_name: plantdx-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: plantdx-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=postgresql://plantdx:plantdx@db:5432/plantdx
    depends_on:
      db:
        condition: service_healthy

  web-admin:
    image: node:20-alpine
    container_name: plantdx-web-admin
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./web-admin:/app
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend

volumes:
  plantdx-pgdata:
