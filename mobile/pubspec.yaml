name: agrixai_farmer
description: "AgriXAI — ứng dụng nông dân chẩn đoán bệnh cà chua kèm giải thích XAI."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  # Icon hai tông màu trong thiết kế được vẽ lại nguyên si bằng SVG.
  flutter_svg: ^2.0.10
  # Nút "Nghe đọc" ở màn 05 — đọc câu giải thích XAI bằng tiếng Việt.
  flutter_tts: ^4.0.2
  # Gọi API backend thật (đăng nhập, danh mục, chẩn đoán).
  http: ^1.2.2
  # Chụp ảnh / chọn ảnh từ thư viện ở màn 03.
  image_picker: ^1.1.2
  # Nén ảnh trước khi gửi — backend giới hạn 10 MB mỗi ảnh.
  flutter_image_compress: ^2.3.0
  # Lưu JWT sau khi đăng nhập, sống sót qua lần mở app kế tiếp.
  flutter_secure_storage: ^9.2.2
  # Mở link mua thuốc và video YouTube hướng dẫn ở màn 06.
  url_launcher: ^6.3.1
  # Chạy mô hình nhận diện bệnh ngay trên máy khi không có mạng (MB offline).
  flutter_onnxruntime: ^1.8.0
  # Giải mã/resize ảnh thành tensor đầu vào và vẽ vùng khoanh khi suy luận offline.
  image: ^4.3.0
  # Thư mục tạm để lưu ảnh đã khoanh vùng khi suy luận offline.
  path_provider: ^2.1.4
  # Đọc số phiên bản thật từ pubspec.yaml cho dòng "Về ứng dụng" ở màn Hồ sơ.
  package_info_plus: ^9.0.1
  # Mở thẳng màn Cài đặt ứng dụng khi người dùng từ chối quyền camera ở màn 03.
  permission_handler: ^11.3.1
  # Phát video YouTube ngay trong app ở màn 06 — dùng IFrame Player API qua
  # webview_flutter chính chủ Flutter team (postMessage, không phải hai lớp
  # bắt cử chỉ chồng nhau như youtube_player_flutter cũ).
  youtube_player_iframe: ^5.2.1
  # Trước đây chỉ là phụ thuộc gián tiếp qua youtube_player_iframe — khai báo
  # thẳng vì treatment_screen.dart gọi trực tiếp AndroidWebViewCookieManager
  # để bật cookie bên thứ ba (sửa lỗi video YouTube báo "Error code: 152").
  webview_flutter_android: ^4.3.4
  webview_flutter_platform_interface: ^2.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # Sinh icon ứng dụng trên máy client (Android/iOS) từ đúng logo lá hai tông
  # đang dùng trong app (xem AgriIcons.leaf) — chỉ chạy thủ công
  # (`dart run flutter_launcher_icons`) khi đổi ảnh nguồn, không chạy lúc build.
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    # Mô hình nhận diện bệnh + danh mục bệnh, dùng khi không có mạng — xem
    # mobile/lib/services/offline_inference_service.dart.
    - assets/model/tomato_leaf_v1.onnx
    - assets/model/tomato_leaf_v1_meta.json
    - assets/model/tomato_diseases.json

  # Open Sans bản variable: khai báo lại cùng một file cho từng weight để
  # Flutter khớp đúng weight (không tự làm đậm giả), rồi trục `wght` trong
  # `fontVariations` mới là thứ tạo ra độ đậm thật. Xem core/app_typography.dart.
  fonts:
    - family: Open Sans
      fonts:
        - asset: assets/fonts/OpenSans-Variable.ttf
          weight: 400
        - asset: assets/fonts/OpenSans-Variable.ttf
          weight: 500
        - asset: assets/fonts/OpenSans-Variable.ttf
          weight: 600
        - asset: assets/fonts/OpenSans-Variable.ttf
          weight: 700
        - asset: assets/fonts/OpenSans-Variable.ttf
          weight: 800

# Icon ứng dụng trên máy client — cùng logo lá hai tông (olive/cream trên nền
# primary) đang dùng làm huy hiệu trong app (màn Đăng nhập, màn chờ khởi
# động), thay cho icon mascot Flutter mặc định.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon_legacy.png"
  adaptive_icon_background: "#2E6F40"
  adaptive_icon_foreground: "assets/icons/app_icon_foreground.png"
  min_sdk_android: 24
  remove_alpha_ios: true
