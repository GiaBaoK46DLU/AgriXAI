org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# Dự án nằm ở ổ D:, Pub Cache mặc định nằm ở ổ C: — trình biên dịch Kotlin
# tăng dần (incremental) tính đường dẫn tương đối giữa hai ổ đĩa khác nhau
# trên Windows và ném `IllegalArgumentException: this and base files have
# different roots`, gặp lần đầu khi thêm `webview_flutter_android` (gói
# WebView có mã Kotlin — các gói trước đó dùng gặp toàn là Java nên chưa lộ ra
# lỗi này). Gradle tự phục hồi bằng cách biên dịch lại không tăng dần nên
# build vẫn ra APK, chỉ chậm hơn và log đầy stack trace gây hoang mang — tắt
# hẳn incremental compile cho gọn, đổi lại build luôn chậm hơn một chút.
kotlin.incremental=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
